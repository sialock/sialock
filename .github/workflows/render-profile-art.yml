name: Build 3D research artwork

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/render_profile_art.py"
      - ".github/workflows/render-profile-art.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image renderer
        run: python -m pip install --disable-pip-version-check "numpy>=1.24,<3" "Pillow>=10,<12"
      - name: Create original 3D-inspired PNG banners
        run: python scripts/render_profile_art.py
      - name: Render the real Monte Carlo energy example as PNG
        run: |
          python -m pip install --disable-pip-version-check "CairoSVG==2.8.2"
          python - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          import cairosvg
          source = "https://raw.githubusercontent.com/sialock/protein-folding-/main/assets/demo_energy.svg"
          vector = urlopen(source, timeout=30).read()
          cairosvg.svg2png(bytestring=vector,write_to="assets/protein-mc-example.png",output_width=900)
          print("Rendered project plot from published source")
          PY
      - name: Commit finished artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-molecular-lab.png assets/hero-protein-atlas.png assets/hero-data-skyline.png assets/protein-mc-example.png
          if ! git diff --cached --quiet; then
            git commit -m "design: render three original 3D profile banners [skip ci]"
            git push
          else
            echo "Banner assets unchanged."
          fi
