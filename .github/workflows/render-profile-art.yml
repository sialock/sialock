name: Build 3D research artwork

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/render_profile_art.py"
      - ".github/workflows/render-profile-art.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image renderer
        run: python -m pip install --disable-pip-version-check "numpy>=1.24,<3" "Pillow>=10,<12"
      - name: Create original 3D-inspired PNG banners
        run: python scripts/render_profile_art.py
      - name: Commit finished artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-molecular-lab.png assets/hero-protein-atlas.png assets/hero-data-skyline.png
          if ! git diff --cached --quiet; then
            git commit -m "design: render three original 3D profile banners [skip ci]"
            git push
          else
            echo "Banner assets unchanged."
          fi
