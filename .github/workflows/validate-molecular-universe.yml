name: Validate Molecular Universe

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/validate-molecular-universe.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/validate-molecular-universe.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check docs/app.js
      - name: Check local site links and assets
        run: python docs/verify.py