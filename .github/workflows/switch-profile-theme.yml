name: Switch SIA-LAB profile theme

on:
  workflow_dispatch:
    inputs:
      theme:
        description: Select a 3D hero design
        required: true
        type: choice
        default: molecular
        options:
          - molecular
          - protein
          - skyline

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch image reference in README
        env:
          THEME: ${{ inputs.theme }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          themes = {
              "molecular": "hero-molecular-lab.png",
              "protein": "hero-protein-atlas.png",
              "skyline": "hero-data-skyline.png"
          }
          selected = themes[os.environ["THEME"]]
          readme = Path("README.md")
          old = readme.read_text(encoding="utf-8")
          new, count = re.subn(
              r'(?<=src="./assets/)hero-(?:molecular-lab|protein-atlas|data-skyline)\.png(?=")',
              selected, old, count=1
          )
          if count != 1:
              raise SystemExit("README hero image was not found uniquely")
          readme.write_text(new,encoding="utf-8")
          print(f"Selected {selected}")
          PY
      - name: Commit selected theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "design: switch 3D profile theme [skip ci]"
            git push
          else
            echo "Requested theme is already active."
          fi
